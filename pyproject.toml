[project]
name = "python-uv-template"
version = "0.1.0"
description = "A Project Template of Python with uv"
authors = [{ name = "杜世橋 Du Shiqiao", email = "lucidfrontier.45@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["fastapi>=0.116.1", "uvicorn[standard]>=0.35.0"]

[project.scripts]
app = "app.cli:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["app"]

[tool.uv]
managed = true
dev-dependencies = [
    "pyright>=1.1.377",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.6.1",
    "taskipy>=1.13.0",
]

[tool.taskipy.tasks]
pyright_lint = "pyright ."
uv_format = "uv format ."
uv_lint = "uv check ."
uv_fix = "uv check --fix ."
test = "pytest tests -n auto --cov=app --cov-report=term --cov-report=xml"
format = "task uv_fix && task uv_format"
lint = "task uv_lint && task pyright_lint"
check = "task format && task lint && task test"

[tool.pytest.ini_options]
filterwarnings = ["ignore::FutureWarning"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "RUF",
    "UP",
    "N",
    "SIM",
    "A",
    "S",
    "DTZ",
    "PIE",
    "PLE",
]
# add directory names to exclude from analysis
exclude = ["tests/**/*", "deps/**/*"]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ['F401']

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
# add directory names to exclude from analysis
ignore = ["deps"]
